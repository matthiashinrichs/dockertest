name: Container image

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref_type == 'tag' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test .

  publish:
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image tags
        id: image
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          revision=$(git rev-parse HEAD)
          version=edge
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              printf '%s\n' 'Expected a release tag in vMAJOR.MINOR.PATCH format.' >&2
              exit 1
            fi
            version=$GITHUB_REF_NAME
          fi
          printf 'IMAGE=%s\nREVISION=%s\nVERSION=%s\n' "$image" "$revision" "$version" >> "$GITHUB_ENV"
          printf 'image=%s\n' "$image:$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish multi-arch image
        shell: bash
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            tags+=(--tag "$IMAGE:$REVISION")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            "${tags[@]}" \
            --push \
            .

      - name: Verify published image platforms
        shell: bash
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm64"]'

      - name: Promote verified release to latest
        if: github.ref_type == 'tag'
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Multi-arch container image for Linux AMD64 and ARM64: \`$RELEASE_IMAGE\`" \
            --generate-notes
